    home:
        title: "SpicyMatch — The right pairings for your spices"
        meta_description: "Pick a spice: SpicyMatch tells you what it pairs with and how to cook it. Free, no account, no tracking."
        hero:
            eyebrow: "Spice pairings · the science of aroma"
            title: "No more blending"
            title_accent: "in the dark."
            lead: "Pick a spice: SpicyMatch tells you what it pairs with, and how to cook it."
            blurb: "We draw on the science of aroma and centuries of recipes to give you a reliable starting point. Then it's your turn to taste, tweak and enjoy."
            cta_lab: "Make my first blend"
            cta_spices: "Browse spices"
            reassure_label: "Our commitments"
            reassure_free: "Free"
            reassure_no_account: "No account"
            reassure_no_tracking: "No tracking"
            proof: "%spices% spices · %compounds% linked aromas"
        demo:
            eyebrow: "Try it, right here, right now"
            title: "Which spice are you craving?"
            chips_label: "Spices to try"
            hint: "Tap a spice to see its best pairings."
            loading: "The mortar is at work…"
            error: "The mortar is running a bit hot, try again in a moment."
            empty: "No obvious pairing for this one: the Lab will help you match it."
            continue: "Continue in the Lab with %spice%"
        how:
            label: "The method"
            title: "Science does the trial runs."
            title_accent: "You keep the fun."
            choose_title: "Choose"
            choose_text: "A spice you're in the mood for, or two that have been waiting at the back of the cupboard."
            discover_title: "Discover"
            discover_text: "We cross-check their aromas with pairings that have proven themselves in the kitchen. What comes out are the spices that truly have something in common."
            cook_title: "Cook"
            cook_text: "Preparation, when to add, little techniques: you leave with a recipe ready to follow."
            honesty: "No magic formula: a reliable compass. Your palate always has the final say."
        experiment:
            label: "I · Experiment"
            title: "The Lab,"
            title_accent: "your mortar of ideas."
            text: "Drop two spices into the mortar, watch the pairings take shape, add the one that lifts everything. In a few clicks, a vague idea becomes a blend you want to taste tonight."
            point_ranked: "Pairings ranked, from the most obvious to the boldest"
            point_gestures: "For each spice: how to prepare it, when to add it"
            point_cooking_mode: "A final recipe with a cooking mode, screen on, hands free"
            point_saved: "Your blends saved and your favourites at hand (with a free account)"
            cta: "Open the Lab"
        learn:
            label: "II · Learn"
            title: "Understand what you taste,"
            title_accent: "without the jargon."
            text: "Why coriander loves citrus, why we toast cumin: every spice has its story and its affinities. Everything is explained simply and open to all."
            techniques_title: "The techniques that change everything"
            technique_num: "Card no. %num%"
            dry_heat: "Dry heat"
            wet_heat: "Gentle heat"
            mechanical: "Cold"
            roast_title: "Toasting"
            roast_sub: "dry, in a pan"
            roast_benefit: "Dry heat wakes up the fragrant oils: a deeper, almost nutty flavour."
            roast_spices: "Cumin · Coriander · Fennel"
            infusion_title: "Infusion"
            infusion_sub: "over low heat, in fat"
            infusion_benefit: "Many aromas love fat: hot oil or butter captures them and carries them through the whole dish."
            infusion_spices: "Rosemary · Bay leaf · Chilli"
            pound_title: "Pounding"
            pound_sub: "in a mortar"
            pound_benefit: "The pestle crushes seeds without heating them: the scents stay bright, cleaner than from a grinder."
            pound_spices: "Pepper · Cardamom · Basil"
            doors_label: "Explore the catalogue"
            door_spices: "Spice profiles"
            door_groups: "Aromatic families"
            door_methods: "Preparation methods"
            cta: "Explore the spices"
        play:
            label: "III · Play"
            title: "Remember the pairings"
            title_accent: "without studying."
            text: "Six mini-games to turn good pairings into reflexes: spot the odd one out, hold on in survival mode, beat the clock… Five minutes a day, and one evening you'll just know."
            quota: "%count% games per mode per day, on the house. Badges, levels and streaks for the joy of progressing."
            cta: "Play a game"
        values:
            label: "Where we stand"
            title: "An honest project,"
            title_accent: "open to all."
            tracking_title: "Zero tracking"
            tracking_text: "No tracking cookies, no endless banner. Only what the site needs to work."
            free_title: "Knowledge is free"
            free_text: "Profiles, pairings, methods, recipes: nothing is locked behind a subscription. Ever."
            ads_title: "Well-behaved ads"
            ads_text: "A few understated ads, no tracking, never in the middle of a recipe or a game."
            games_title: "Games, generously"
            games_text: "%count% games per mode per day, for everyone, free of charge."
        support:
            title: "Knowledge is priceless."
            title_accent: "Comfort, if you want it."
            text: "All of SpicyMatch's information is free and will stay that way. Games are an extra feature. If you want to go further, become a supporter: zero ads, %count% games per mode per day, and the satisfaction of keeping an independent project alive."
            cta: "Support SpicyMatch"
            soon: "Coming soon"
        final:
            title: "Tonight,"
            title_accent: "what are you cooking?"
            text: "Pick a spice. We handle the pairings, you handle the flavour."
            cta: "Start my blend"
            register: "Create a free account to keep my recipes"
