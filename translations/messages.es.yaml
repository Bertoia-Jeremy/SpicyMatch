            purposes_title: Finalidades
            purposes_text: Los datos se utilizan exclusivamente para prestar el servicio (cuenta, mezclas, progresión), responder a sus solicitudes, enviar el boletín si lo ha consentido y garantizar la seguridad del sitio. Ningún dato se vende ni se comparte con terceros con fines comerciales.
            ads_title: Publicidad
            ads_text: 'Cuando la publicidad está activa, SpicyMatch muestra anuncios contextuales de redes sin cookies ni perfilado (EthicalAds o Carbon). El script de la red solo se carga cuando el espacio publicitario se vuelve visible; su navegador le transmite entonces su dirección IP y su user-agent, sin cookies ni seguimiento entre sitios — base legal: interés legítimo. Puede oponerse pasando a una cuenta Premium.'
            retention_title: Plazos de conservación
            retention_text: 'Cuenta: mientras la cuenta esté activa; tras la eliminación, anonimización definitiva en un plazo de 30 días. Mensajes de contacto: 12 meses tras su recepción. Solicitudes de ejercicio de derechos: 6 años (prueba de la tramitación). Boletín: hasta la baja.'
            cookies_title: Cookies
